<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F8F7F3" />
<meta name="description" content="A little place for your people. Explore the stories in your friends' rooms." />
<title>The House — A place for your people</title>
<link rel="preload" href="./assets/house-approved.webp" as="image" type="image/webp" />
<link rel="stylesheet" href="./styles.css?v=8" />
<script defer src="./app.js?v=8"></script>
</head>
<body>
<div class="app">
  <header class="header">
    <button id="brand-home" class="wordmark" aria-label="Return to the whole house"><span class="mark" aria-hidden="true">⌂</span>the house<span class="dot">.</span></button>
    <span class="header-caption">a place for your people</span>
    <button id="circle-trigger" class="circle-control" aria-expanded="false" aria-controls="circle-menu"><span class="circle-monogram">B</span><span class="circle-name">Bloom Street</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg></button>
    <div id="circle-menu" class="circle-menu" hidden>
      <strong>Bloom Street</strong><p>A private little world for three friends.</p><span class="menu-status">Prototype · changes saved on this device</span>
    </div>
  </header>
  <main class="canvas-area">
    <div id="stage" class="stage" aria-label="Explore The House">
      <svg id="house-scene" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid meet" aria-label="Cutaway illustration of a house with three rooms">
        <image width="1672" height="941" href="./assets/house-approved.webp" />
        <g id="room-hits" aria-label="Choose a room">
          <path class="room-hit" data-room="maya" tabindex="0" role="button" aria-label="Enter Maya's room" d="M226 175 L817 54 L819 433 L227 437 Z" />
          <path class="room-hit" data-room="jay" tabindex="0" role="button" aria-label="Enter Jay's room" d="M844 54 L1533 192 L1534 441 L842 434 Z" />
          <path class="room-hit" data-room="lounge" tabindex="0" role="button" aria-label="Enter the shared lounge" d="M224 449 L1450 450 L1450 761 L224 772 Z" />
        </g>
      </svg>
      <div id="detail-layer" class="detail-layer" hidden>
        <img id="detail-image" alt="" decoding="async" draggable="false" />
        <svg id="object-map" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid meet" aria-label="Objects to explore">
          <g id="object-hits"></g>
        </svg>
      </div>
      <div id="room-tip" class="room-tip" hidden><span class="tip-name"></span><span class="tip-action">Enter room ↗</span></div>
      <div class="scene-heading" id="scene-heading" hidden><span id="scene-eyebrow">PERSONAL SPACE</span><h1 id="scene-title">Maya's room</h1></div>
      <div id="intro-hint" class="intro-hint">A little world to explore <span aria-hidden="true">↗</span></div>
      <div id="room-navigation" class="room-navigation" hidden>
        <button class="home-control" data-nav="home" title="Whole house" aria-label="Whole house">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg>
        </button>
        <span class="nav-divider"></span>
        <button data-nav="maya" class="nav-room">Maya</button>
        <button data-nav="jay" class="nav-room">Jay</button>
        <button data-nav="lounge" class="nav-room">Lounge</button>
      </div>
      <div id="mobile-rooms" class="mobile-rooms" hidden aria-label="Choose a room">
        <button type="button" data-mobile-room="maya">Maya</button>
        <button type="button" data-mobile-room="jay">Jay</button>
        <button type="button" data-mobile-room="lounge">Lounge</button>
      </div>
      <div id="object-discovery" class="object-discovery" hidden><button type="button" id="objects-button" class="objects-button" aria-expanded="false" aria-controls="objects-menu">Objects <span id="objects-count"></span></button><div id="objects-menu" class="objects-menu" hidden></div></div><div id="object-tooltip" class="object-tooltip" hidden></div>
    </div>
  </main>
  <footer class="subfooter"><span>OUR LITTLE CORNER OF THE INTERNET</span><span class="proto-note">A local, interactive prototype</span></footer>
</div>
<div id="dialog-backdrop" class="dialog-backdrop" hidden></div>
<section id="artifact" class="artifact" role="dialog" aria-modal="true" aria-label="Explore an object" hidden>
  <div class="artifact-top"><div class="artifact-meta"><span class="topline" id="artifact-kicker">FROM THE ROOM</span><span class="artifact-index" id="artifact-index"></span></div><button id="artifact-close" class="close-button" aria-label="Close and return to the room">×</button></div>
  <div id="artifact-body" class="artifact-body"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
